<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>越南服基址菜单 - 三玖内部</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#eee}

#menu{
  width:100%;height:100%;
  background:linear-gradient(160deg,#1a1a2e,#16213e 50%,#0f3460);
  border-radius:14px;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.header{
  text-align:center;
  padding-bottom:6px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:6px;
  flex-shrink:0;
}
.header h2{font-size:15px;font-weight:600;color:#00d4ff}
.header .author{font-size:12px;color:#ff6b9d;margin-top:3px;letter-spacing:2px}

.addr-box{
  background:rgba(0,0,0,.28);
  border-radius:8px;
  padding:6px 8px;
  margin-bottom:6px;
  font-size:11px;
  line-height:1.45;
  flex-shrink:0;
}
.addr-box .base{color:#00ff9d;font-weight:600;margin-bottom:3px}
.addr-item{display:flex;justify-content:space-between}
.addr-item span:first-child{color:#aaa}
.addr-item span:last-child{color:#fff;font-family:monospace;font-size:10px}

.status{
  font-size:11px;
  color:#aaa;
  text-align:center;
  margin-bottom:6px;
  flex-shrink:0;
}

/* 功能区可滑动，并增加底部空间 */
.btn-scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:40px;   /* 关键！让最后的按钮能滑出来 */
}

.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.btn{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  border-radius:8px;
  color:#fff;
  font-size:12px;
  font-weight:500;
  padding:11px 4px;
  text-align:center;
}
.btn:active{
  background:rgba(0,212,255,.28);
  border-color:#00d4ff;
}

.btn.primary{background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;color:#001a22;font-weight:600}
.btn.success{background:rgba(0,200,100,.16);border-color:rgba(0,200,100,.35);color:#00e676}
.btn.warning{background:rgba(255,180,0,.16);border-color:rgba(255,180,0,.35);color:#ffc107}
.btn.danger{background:rgba(255,60,60,.16);border-color:rgba(255,60,60,.35);color:#ff6b6b}
.btn.info{background:rgba(100,150,255,.16);border-color:rgba(100,150,255,.35);color:#82b1ff}

.footer{
  text-align:center;
  font-size:11px;
  color:#ff6b9d;
  margin-top:4px;
  flex-shrink:0;
}
</style>
</head>
<body>
<div id="menu">
  <div class="header">
    <h2>越南服 · 基址菜单</h2>
    <div class="author">三玖内部</div>
  </div>

  <div class="addr-box" id="addrBox">
    <div class="base">正在获取基址...</div>
  </div>

  <div class="status" id="status">就绪</div>

  <div class="btn-scroll" id="mainScroll">
    <div class="btn-group" id="mainBtns">

      <div class="btn primary" onclick="doAction('refresh')">刷新地址</div>
      <div class="btn" onclick="doAction('read')">查看数值</div>

      <div class="btn success" onclick="doAction('patch',0)">修改字节①</div>
      <div class="btn success" onclick="doAction('patch',1)">修改字节②</div>
      <div class="btn success" onclick="doAction('patch',2)">修改字节③</div>
      <div class="btn success" onclick="doAction('patch',3)">修改字节④</div>

      <div class="btn success" style="grid-column:span 2" onclick="doAction('oneclick')">一键修改字节（通用）</div>

      <div class="btn info" onclick="doAction('ret',0)">①→RET</div>
      <div class="btn info" onclick="doAction('ret',1)">②→RET</div>
      <div class="btn info" onclick="doAction('ret',2)">③→RET</div>
      <div class="btn info" onclick="doAction('ret',3)">④→RET</div>

      <div class="btn info" onclick="doAction('true',0)">①返回真</div>
      <div class="btn info" onclick="doAction('true',1)">②返回真</div>
      <div class="btn info" onclick="doAction('true',2)">③返回真</div>
      <div class="btn info" onclick="doAction('true',3)">④返回真</div>

      <div class="btn info" onclick="doAction('false',0)">①返回假</div>
      <div class="btn info" onclick="doAction('false',1)">②返回假</div>
      <div class="btn info" onclick="doAction('false',2)">③返回假</div>
      <div class="btn info" onclick="doAction('false',3)">④返回假</div>

      <div class="btn warning" onclick="doAction('search')">精确搜索</div>
      <div class="btn warning" onclick="doAction('nearby')">邻近搜索</div>
      <div class="btn warning" onclick="doAction('refine')">二次搜索</div>
      <div class="btn warning" onclick="doAction('results')">查看结果</div>
      <div class="btn warning" onclick="doAction('editall')">全部修改</div>
      <div class="btn warning" onclick="doAction('freeze')">冻结/解冻</div>
      <div class="btn danger" onclick="doAction('clear')">清除结果</div>
      <div class="btn success" onclick="doAction('restore')">恢复原始字节</div>

      <div class="btn primary" style="grid-column:span 2" onclick="doAction('reinit')">重新初始化</div>
    </div>
  </div>

  <div class="footer">三玖内部</div>
</div>

<script>
var offsets = [0x02FF1A00, 0x02FF3080, 0x02E8A4F4, 0x062BD138];
var originalBytes = ["E603371E", "C0035FD6", "21208052", "C0035FD6"];
var currentAddrs = [];
var freezeTimer = null;
var lastSearchType = "F32";

function setStatus(t) {
  try { document.getElementById("status").innerText = t; } catch(e) {}
}

function getBase() {
  try { return Number(h5gg.getRangesList(0)[0].start); } catch(e) { return 0; }
}

function calcAddrs() {
  var base = getBase();
  currentAddrs = [];
  for (var i = 0; i < offsets.length; i++) {
    currentAddrs.push(base + offsets[i]);
  }
  return base;
}

function refreshAddr() {
  var base = calcAddrs();
  var html = '<div class="base">当前基址: 0x' + base.toString(16).toUpperCase() + '</div>';
  for (var i = 0; i < 4; i++) {
    html += '<div class="addr-item"><span>地址' + (i+1) + '</span><span>0x' + currentAddrs[i].toString(16).toUpperCase() + '</span></div>';
  }
  document.getElementById("addrBox").innerHTML = html;
  setStatus("地址已刷新");
}

function patchBytes(addr, hex) {
  hex = String(hex).replace(/\s+/g, "").toUpperCase();
  if (hex.length % 2 !== 0) throw "字节长度必须是偶数";
  for (var i = 0; i < hex.length / 2; i++) {
    var b = parseInt(hex.substr(i * 2, 2), 16);
    h5gg.setValue(addr + i, b, "U8");
  }
}

// 更稳妥的修改（减少闪退）
function safePatch(idx, bytes) {
  try {
    if (!currentAddrs[idx]) calcAddrs();
    var addr = currentAddrs[idx];

    // 先尝试读取，确认地址有效
    try { h5gg.getValue(addr, "U8"); } catch(e) {}

    patchBytes(addr, bytes);

    setStatus("地址" + (idx+1) + " 修改成功");
    alert("地址" + (idx+1) + " 修改成功\n" + bytes);
  } catch(e) {
    alert("修改失败（可能无写入权限或地址无效）\n" + e);
    setStatus("修改失败");
  }
}

function doAction(type, idx) {
  try {
    if (type === "refresh") {
      refreshAddr();
    }
    else if (type === "read") {
      var t = prompt("选择类型\n1=Int32  2=Float  3=Double", "2");
      if (!t) return;
      var typeMap = {"1":"I32", "2":"F32", "3":"F64"};
      var tp = typeMap[t] || "F32";
      var msg = "类型: " + tp + "\n\n";
      for (var i = 0; i < 4; i++) {
        var v = "失败";
        try { v = h5gg.getValue(currentAddrs[i], tp); } catch(e) {}
        msg += "地址" + (i+1) + ": " + v + "\n";
      }
      alert(msg);
    }
    else if (type === "patch") {
      var cur = "";
      try {
        for (var i = 0; i < 4; i++) {
          cur += ("0" + Number(h5gg.getValue(currentAddrs[idx] + i, "U8")).toString(16)).slice(-2).toUpperCase();
        }
      } catch(e) { cur = originalBytes[idx]; }
      var neu = prompt("修改地址" + (idx+1) + "\n当前: " + cur + "\n原始: " + originalBytes[idx] + "\n输入新字节:", cur);
      if (neu) safePatch(idx, neu);
    }
    else if (type === "oneclick") {
      var c = prompt("输入地址编号 (1-4)", "1");
      if (!c) return;
      var i = Number(c) - 1;
      if (i < 0 || i > 3) return alert("只能输入1-4");
      var o = prompt("1=RET\n2=返回真\n3=返回假\n4=NOP\n5=自定义", "1");
      if (!o) return;
      var bytes = "";
      if (o === "1") bytes = "C0035FD6";
      else if (o === "2") bytes = "200080D2C0035FD6";
      else if (o === "3") bytes = "000080D2C0035FD6";
      else if (o === "4") bytes = "1F2003D5";
      else if (o === "5") bytes = prompt("输入自定义字节", originalBytes[i]);
      if (bytes) safePatch(i, bytes);
    }
    else if (type === "ret") {
      safePatch(idx, "C0035FD6");
    }
    else if (type === "true") {
      safePatch(idx, "200080D2C0035FD6");
    }
    else if (type === "false") {
      safePatch(idx, "000080D2C0035FD6");
    }
    else if (type === "restore") {
      for (var i = 0; i < 4; i++) {
        try { patchBytes(currentAddrs[i], originalBytes[i]); } catch(e) {}
      }
      alert("已尝试恢复原始字节");
      setStatus("已恢复");
    }
    else if (type === "search") {
      var tp = prompt("搜索类型\n1=Int32  2=Float  3=Double  4=Int16", "2");
      var map = {"1":"I32","2":"F32","3":"F64","4":"I16"};
      lastSearchType = map[tp] || "F32";
      var val = prompt("输入数值（支持范围 10~50）", "");
      if (!val) return;
      h5gg.clearResults();
      h5gg.searchNumber(val, lastSearchType, "0x0", "0xFFFFFFFF00000000");
      var cnt = h5gg.getResultsCount();
      setStatus("找到 " + cnt + " 个");
      alert("搜索完成，找到 " + cnt + " 个");
    }
    else if (type === "nearby") {
      var val = prompt("邻近数值", "");
      if (!val) return;
      var range = prompt("范围", "0x100");
      h5gg.searchNearby(val, lastSearchType, range || "0x100");
      alert("邻近搜索完成，剩余 " + h5gg.getResultsCount() + " 个");
    }
    else if (type === "refine") {
      var val = prompt("二次搜索数值", "");
      if (!val) return;
      h5gg.searchNumber(val, lastSearchType, "0x0", "0xFFFFFFFF00000000");
      alert("二次搜索完成，剩余 " + h5gg.getResultsCount() + " 个");
    }
    else if (type === "results") {
      var c = h5gg.getResultsCount();
      if (c <= 0) return alert("没有结果");
      var max = Math.min(c, 20);
      var res = h5gg.getResults(max, 0);
      var msg = "前" + max + "个（共" + c + "）:\n\n";
      for (var i = 0; i < res.length; i++) {
        msg += (i+1) + ". 0x" + Number(res[i].address).toString(16).toUpperCase() + " = " + res[i].value + "\n";
      }
      alert(msg);
    }
    else if (type === "editall") {
      var c = h5gg.getResultsCount();
      if (c <= 0) return alert("没有结果");
      var val = prompt("全部修改为", "");
      if (!val) return;
      var n = h5gg.editAll(val, lastSearchType);
      alert("成功修改 " + n + " 个");
    }
    else if (type === "clear") {
      h5gg.clearResults();
      setStatus("已清除");
      alert("结果已清除");
    }
    else if (type === "freeze") {
      if (freezeTimer) {
        clearInterval(freezeTimer);
        freezeTimer = null;
        setStatus("已停止冻结");
        return alert("冻结已停止");
      }
      var c = h5gg.getResultsCount();
      if (c <= 0) return alert("没有结果");
      var val = prompt("冻结成什么值", "");
      if (!val) return;
      var max = Math.min(c, 60);
      var res = h5gg.getResults(max, 0);
      freezeTimer = setInterval(function() {
        try {
          for (var i = 0; i < res.length; i++) {
            h5gg.setValue(res[i].address, val, lastSearchType);
          }
        } catch(e) {}
      }, 600);
      setStatus("冻结中(" + max + "个)");
      alert("开始冻结前" + max + "个");
    }
    else if (type === "reinit") {
      if (freezeTimer) { clearInterval(freezeTimer); freezeTimer = null; }
      calcAddrs();
      refreshAddr();
      setStatus("重新初始化完成");
      alert("已重新初始化");
    }
  } catch(e) {
    alert("执行出错: " + e);
    setStatus("出错");
  }
}

// 初始化
try {
  refreshAddr();
  setWindowRect(8, 15, 340, 700);   // 窗口更高一点
  setWindowDrag(0, 0, 340, 42);
} catch(e) {}
</script>
</body>
</html>
